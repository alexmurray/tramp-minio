name: Test
on: [push, pull_request]
jobs:
  ert:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs: ['29.4', '30.2', 'snapshot']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - run: emacs -Q --batch -L . --eval '(setq byte-compile-error-on-warn t)' -f batch-byte-compile tramp-minio.el
      - run: TRAMP_MINIO_FAKE_MC="$PWD/tests/fake-mc" emacs -Q --batch -L . -l tests/tramp-minio-tests.el -f ert-run-tests-batch-and-exit
